name: Tipsheet
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions: [en, zh-Hans, zh-Hant]
settings:
  base:
    APP_ID: com.hgsldswk.tipsheet
    APP_STORE_ID: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  Tipsheet:
    type: application
    platform: iOS
    sources: [Tipsheet, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Tipsheet AppStore
    info:
      path: Tipsheet/Info.plist
      properties:
        CFBundleDisplayName: Tipsheet
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSFaceIDUsageDescription: Unlock your Tipsheet records with Face ID.
        ITSAppUsesNonExemptEncryption: false
        APP_STORE_ID: $(APP_STORE_ID)
        CFBundleURLTypes:
          - CFBundleURLName: com.hgsldswk.tipsheet
            CFBundleURLSchemes: [tipsheet]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.hgsldswk.tipsheet.backup
            UTTypeDescription: Tipsheet Backup
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [tipsheet]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Tipsheet Backup
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.hgsldswk.tipsheet.backup]
    entitlements:
      path: Tipsheet/Tipsheet.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hgsldswk.tipsheet]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.hgsldswk.tipsheet]
        com.apple.developer.icloud-services: [CloudKit]
    dependencies:
      - target: TipsheetWidget
  TipsheetWidget:
    type: app-extension
    platform: iOS
    sources:
      - TipsheetWidget
      - Shared/WidgetBridge.swift
      - Shared/Localization.swift
      - Shared/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Tipsheet Widget AppStore
    info:
      path: TipsheetWidget/Info.plist
      properties:
        CFBundleDisplayName: Tipsheet
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: TipsheetWidget/TipsheetWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hgsldswk.tipsheet]
  TipsheetTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TipsheetTests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  TipsheetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TipsheetUITests]
    dependencies:
      - target: Tipsheet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Tipsheet
schemes:
  Tipsheet:
    build:
      targets:
        Tipsheet: all
        TipsheetTests: [test]
    test:
      config: Debug
      targets: [TipsheetTests]
  TipsheetUI:
    build:
      targets:
        Tipsheet: all
        TipsheetUITests: [test]
    test:
      config: Debug
      targets: [TipsheetUITests]
